services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iview
      POSTGRES_PASSWORD: iview
      POSTGRES_DB: iview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iview -d iview"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://iview:iview@postgres:5432/iview?sslmode=disable

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev

volumes:
  postgres_data:
